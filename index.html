<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовые комнаты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .auth-screen {
            text-align: center;
        }

        .auth-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .main-screen {
            display: none;
        }

        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-details h2 {
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.busy {
            background: #ef4444;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .team-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .team-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .member-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #666;
        }

        .join-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
        }

        .join-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .in-call-indicator {
            background: #fef3c7;
            color: #92400e;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 30px 0 15px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .voice-chat-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            display: none;
            color: white;
        }

        .voice-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .voice-chat-title {
            font-size: 18px;
            font-weight: 600;
        }

        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .participant-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .participant-avatar {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            position: relative;
        }

        .speaking-indicator {
            position: absolute;
            inset: -3px;
            border: 3px solid #4ade80;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .participant-name {
            font-size: 14px;
            font-weight: 500;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .audio-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .audio-btn.muted {
            background: #ef4444;
        }

        .leave-call-btn {
            background: #ef4444;
            width: 100%;
        }

        .leave-call-btn:hover {
            background: #dc2626;
            transform: none;
        }

        .call-active {
            background: #dcfce7;
            border-color: #4ade80;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        .debug-log {
            background: rgba(0,0,0,0.1);
            padding: 10px;
            border-radius: 8px;
            margin-top: 10px;
            font-family: monospace;
            font-size: 12px;
            max-height: 150px;
            overflow-y: auto;
            color: white;
        }

        /* Hidden audio elements container */
        #remoteAudioContainer {
            display: none;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
                border-radius: 12px;
            }

            .user-info {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .controls {
                width: 100%;
                flex-direction: column;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }

            .participants-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎙️</div>
            <div>
                <h1>Голосовые комнаты</h1>
                <div class="subtitle">Групповой голосовой чат</div>
            </div>
        </div>

        <!-- Password Screen -->
        <div id="passwordScreen" class="auth-screen">
            <div class="auth-form">
                <div class="form-group">
                    <label for="passwordInput">Введите пароль доступа</label>
                    <input type="password" id="passwordInput" placeholder="Пароль">
                </div>
                <button onclick="checkPassword()">Войти</button>
                <div id="passwordError" class="error-message" style="display: none; margin-top: 15px;"></div>
            </div>
        </div>

        <!-- Name Screen -->
        <div id="nameScreen" class="auth-screen" style="display: none;">
            <div class="auth-form">
                <div class="form-group">
                    <label for="nameInput">Введите ваше имя</label>
                    <input type="text" id="nameInput" placeholder="Ваше имя">
                </div>
                <button onclick="enterApp()">Войти</button>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainScreen" class="main-screen">
            <div class="user-info">
                <div class="user-details">
                    <h2 id="currentUserName">Имя пользователя</h2>
                    <div class="status-badge">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Свободен</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="btn-secondary" onclick="toggleStatus()">
                        Изменить статус
                    </div>
                    <div class="btn-secondary" onclick="logout()">
                        Выйти
                    </div>
                </div>
            </div>

            <!-- Voice Chat UI -->
            <div id="voiceChatContainer" class="voice-chat-container">
                <div class="voice-chat-header">
                    <div class="voice-chat-title">🎙️ Голосовой чат</div>
                    <div id="participantCount">1 участник</div>
                </div>

                <div id="participantsGrid" class="participants-grid"></div>

                <div class="audio-controls">
                    <button id="muteBtn" class="audio-btn" onclick="toggleMute()" title="Выкл/Вкл микрофон">
                        🎤
                    </button>
                </div>

                <button class="join-btn leave-call-btn" onclick="leaveCall()">
                    Завершить звонок
                </button>

                <div id="debugLog" class="debug-log"></div>
            </div>

            <h3 class="section-title">Команда онлайн</h3>
            <div id="teamGrid" class="team-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">👥</div>
                    <p>Пока никого нет онлайн</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Hidden container for remote audio elements -->
    <div id="remoteAudioContainer"></div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGduZmCt1qzX_B0YDXIbLG78gzM10O8jE",
            authDomain: "roomy360-604ff.firebaseapp.com",
            databaseURL: "https://roomy360-604ff-default-rtdb.firebaseio.com",
            projectId: "roomy360-604ff",
            storageBucket: "roomy360-604ff.firebasestorage.app",
            messagingSenderId: "96561159668",
            appId: "1:96561159668:web:1e768cc2f70d7520f16da1",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // WebRTC Configuration
        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' }
            ]
        };

        // Global State
        let currentUserId = null;
        let currentUserName = null;
        let currentRoomName = null;
        let localStream = null;
        let peerConnections = {}; // { peerId: RTCPeerConnection }
        let remoteAudios = {}; // { peerId: HTMLAudioElement }
        let isMuted = false;

        // Debug logging
        function log(message) {
            console.log(message);
            const debugLog = document.getElementById('debugLog');
            if (debugLog) {
                const timestamp = new Date().toLocaleTimeString();
                debugLog.innerHTML += `[${timestamp}] ${message}<br>`;
                debugLog.scrollTop = debugLog.scrollHeight;
            }
        }

        // Session Management
        window.addEventListener('load', () => {
            const savedUserId = sessionStorage.getItem('userId');
            const savedUserName = sessionStorage.getItem('userName');
            const isAuthenticated = sessionStorage.getItem('authenticated');

            if (isAuthenticated === 'true' && savedUserId && savedUserName) {
                currentUserId = savedUserId;
                currentUserName = savedUserName;

                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('nameScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                document.getElementById('currentUserName').textContent = currentUserName;

                initializeUser();
                listenToTeam();
            }
        });

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');

            database.ref('settings/password').once('value')
                .then((snapshot) => {
                    const correctPassword = snapshot.val();

                    if (password === correctPassword) {
                        sessionStorage.setItem('authenticated', 'true');
                        document.getElementById('passwordScreen').style.display = 'none';
                        document.getElementById('nameScreen').style.display = 'block';
                        errorDiv.style.display = 'none';
                    } else {
                        errorDiv.textContent = 'Неверный пароль';
                        errorDiv.style.display = 'block';
                    }
                })
                .catch((error) => {
                    console.error('Ошибка проверки пароля:', error);
                    errorDiv.textContent = 'Ошибка подключения';
                    errorDiv.style.display = 'block';
                });
        }

        function enterApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Пожалуйста, введите имя');
                return;
            }

            currentUserName = name;
            currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            sessionStorage.setItem('userId', currentUserId);
            sessionStorage.setItem('userName', currentUserName);

            document.getElementById('nameScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('currentUserName').textContent = currentUserName;

            initializeUser();
            listenToTeam();
        }

        function initializeUser() {
            const userRef = database.ref('users/' + currentUserId);

            userRef.set({
                name: currentUserName,
                status: 'available',
                inCall: false,
                roomName: null,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

            userRef.onDisconnect().update({
                status: 'offline',
                inCall: false,
                roomName: null
            });

            setInterval(() => {
                userRef.update({
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }, 30000);
        }

        function toggleStatus() {
            const statusText = document.getElementById('statusText').textContent;
            const newStatus = statusText === 'Свободен' ? 'busy' : 'available';

            database.ref('users/' + currentUserId).update({
                status: newStatus
            });

            updateStatusUI(newStatus);
        }

        function updateStatusUI(status) {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            if (status === 'available') {
                statusText.textContent = 'Свободен';
                statusDot.classList.remove('busy');
            } else {
                statusText.textContent = 'Занят';
                statusDot.classList.add('busy');
            }
        }

        function listenToTeam() {
            database.ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                const teamGrid = document.getElementById('teamGrid');
                teamGrid.innerHTML = '';

                if (!users) {
                    teamGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <p>Пока никого нет онлайн</p>
                        </div>
                    `;
                    return;
                }

                let hasOthers = false;
                Object.entries(users).forEach(([userId, userData]) => {
                    if (userId !== currentUserId) {
                        hasOthers = true;
                        const card = createTeamCard(userId, userData);
                        teamGrid.appendChild(card);
                    }
                });

                if (!hasOthers) {
                    teamGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <p>Пока никого нет онлайн</p>
                        </div>
                    `;
                }
            });
        }

        function createTeamCard(userId, userData) {
            const card = document.createElement('div');
            card.className = 'team-card';
            if (userData.inCall) {
                card.classList.add('call-active');
            }

            const statusText = userData.status === 'available' ? 'Свободен' : 'Занят';
            const statusClass = userData.status === 'busy' ? 'busy' : '';

            card.innerHTML = `
                <div class="team-card-header">
                    <div>
                        <div class="member-name">${userData.name}</div>
                        <div class="member-status">
                            <span class="status-dot ${statusClass}"></span>
                            ${statusText}
                        </div>
                    </div>
                </div>
                ${userData.inCall ?
                    `<div class="in-call-indicator">🎙️ В голосовом чате</div>
                     <button class="join-btn" onclick="joinRoom('${userId}', '${userData.roomName}')">
                        Присоединиться
                     </button>` :
                    `<button class="join-btn" ${userData.status === 'busy' ? 'disabled' : ''}
                        onclick="startCall('${userId}')">
                        ${userData.status === 'busy' ? '⛔ Занят' : '🎙️ Позвонить'}
                     </button>`
                }
            `;

            return card;
        }

        // WebRTC Voice Chat Functions
        async function startCall(targetUserId) {
            const roomName = 'room_' + Date.now();
            currentRoomName = roomName;

            log('🚀 Начинаю звонок...');

            await setupLocalAudio();

            database.ref('users/' + currentUserId).update({
                inCall: true,
                roomName: roomName
            });

            document.getElementById('voiceChatContainer').style.display = 'block';
            setupSignaling(roomName);
            updateParticipantsList();
        }

        async function joinRoom(targetUserId, roomName) {
            currentRoomName = roomName;

            log('🚀 Присоединяюсь к комнате...');

            await setupLocalAudio();

            database.ref('users/' + currentUserId).update({
                inCall: true,
                roomName: roomName
            });

            document.getElementById('voiceChatContainer').style.display = 'block';
            setupSignaling(roomName);
            updateParticipantsList();
        }

        async function setupLocalAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                log('✅ Микрофон подключен');
            } catch (error) {
                log('❌ Ошибка доступа к микрофону: ' + error.message);
                alert('Не удалось получить доступ к микрофону');
            }
        }

        function setupSignaling(roomName) {
            const roomRef = database.ref('rooms/' + roomName);

            // Announce presence
            roomRef.child('participants/' + currentUserId).set({
                name: currentUserName,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            roomRef.child('participants/' + currentUserId).onDisconnect().remove();

            // Listen for other participants joining
            roomRef.child('participants').on('child_added', (snapshot) => {
                const peerId = snapshot.key;
                const peerData = snapshot.val();

                if (peerId !== currentUserId && !peerConnections[peerId]) {
                    log('👤 Участник присоединился: ' + peerData.name);
                    // Small delay to avoid race conditions
                    setTimeout(() => {
                        createPeerConnection(peerId, true);
                    }, 500);
                }
            });

            // Listen for participants leaving
            roomRef.child('participants').on('child_removed', (snapshot) => {
                const peerId = snapshot.key;
                log('👋 Участник вышел: ' + peerId.substring(0, 8));

                if (peerConnections[peerId]) {
                    peerConnections[peerId].close();
                    delete peerConnections[peerId];
                }

                if (remoteAudios[peerId]) {
                    remoteAudios[peerId].remove();
                    delete remoteAudios[peerId];
                }

                updateParticipantsList();
            });

            // Listen for WebRTC signaling
            const signalingRef = database.ref('signaling/' + roomName + '/' + currentUserId);

            signalingRef.on('child_added', async (snapshot) => {
                const signal = snapshot.val();
                const peerId = signal.from;

                // Ignore signals from self
                if (peerId === currentUserId) {
                    log('⏭️ Пропускаю свой же сигнал: ' + signal.type);
                    snapshot.ref.remove();
                    return;
                }

                log('📡 Получен сигнал: ' + signal.type + ' от ' + peerId.substring(0, 8));

                try {
                    if (signal.type === 'offer') {
                        await handleOffer(peerId, signal.offer);
                    } else if (signal.type === 'answer') {
                        await handleAnswer(peerId, signal.answer);
                    } else if (signal.type === 'ice-candidate') {
                        await handleIceCandidate(peerId, signal.candidate);
                    }
                } catch (error) {
                    log('❌ Ошибка обработки сигнала: ' + error.message);
                }

                snapshot.ref.remove();
            });
        }

        async function createPeerConnection(peerId, isInitiator) {
            log('🔗 Создаю соединение с ' + peerId.substring(0, 8) + ' (initiator: ' + isInitiator + ')');
            log('🔧 ICE серверы: ' + JSON.stringify(iceServers));

            const pc = new RTCPeerConnection(iceServers);
            peerConnections[peerId] = pc;
            log('✅ RTCPeerConnection создан для ' + peerId.substring(0, 8));

            // Add local audio stream
            if (localStream) {
                log('🎤 Локальный поток доступен, треков: ' + localStream.getTracks().length);
                localStream.getTracks().forEach(track => {
                    log('📤 Добавляю трек: ' + track.kind + ', enabled: ' + track.enabled + ', readyState: ' + track.readyState);
                    pc.addTrack(track, localStream);
                });
            } else {
                log('❌ Локальный поток недоступен!');
            }

            // Handle incoming audio
            pc.ontrack = (event) => {
                log('📥 ontrack: получен трек от ' + peerId.substring(0, 8));
                log('📥 Треки в потоке: ' + event.streams[0].getTracks().length);
                event.streams[0].getTracks().forEach(track => {
                    log('📥 Трек: ' + track.kind + ', enabled: ' + track.enabled + ', readyState: ' + track.readyState);
                });

                // Create or reuse audio element
                let audio = remoteAudios[peerId];
                if (!audio) {
                    log('🔊 Создаю новый audio элемент для ' + peerId.substring(0, 8));
                    audio = document.createElement('audio');
                    audio.id = 'audio-' + peerId;
                    audio.autoplay = true;
                    audio.controls = false;
                    document.getElementById('remoteAudioContainer').appendChild(audio);
                    remoteAudios[peerId] = audio;
                } else {
                    log('🔊 Переиспользую audio элемент для ' + peerId.substring(0, 8));
                }

                audio.srcObject = event.streams[0];
                log('🔊 srcObject установлен для ' + peerId.substring(0, 8));

                // Force play with user interaction fallback
                audio.play()
                    .then(() => {
                        log('✅ Аудио воспроизводится от ' + peerId.substring(0, 8) + ', volume: ' + audio.volume);
                    })
                    .catch(error => {
                        log('⚠️ Autoplay ошибка: ' + error.name + ' - ' + error.message);
                        // Create click handler to enable audio
                        const enableAudio = () => {
                            audio.play()
                                .then(() => log('🔊 Аудио включено после клика'))
                                .catch(e => log('❌ Ошибка воспроизведения после клика: ' + e.message));
                            document.removeEventListener('click', enableAudio);
                        };
                        document.addEventListener('click', enableAudio, { once: true });
                    });
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    log('🧊 ICE кандидат для ' + peerId.substring(0, 8) + ': ' + event.candidate.type + ' ' + event.candidate.protocol);
                    sendSignal(peerId, {
                        type: 'ice-candidate',
                        candidate: event.candidate.toJSON(),
                        from: currentUserId
                    });
                } else {
                    log('🧊 ICE сбор завершен для ' + peerId.substring(0, 8));
                }
            };

            // Connection state monitoring
            pc.onconnectionstatechange = () => {
                log('🔌 Connection state [' + peerId.substring(0, 8) + ']: ' + pc.connectionState);
            };

            pc.oniceconnectionstatechange = () => {
                log('🧊 ICE connection state [' + peerId.substring(0, 8) + ']: ' + pc.iceConnectionState);
                if (pc.iceConnectionState === 'failed') {
                    log('❌ ICE соединение не удалось для ' + peerId.substring(0, 8));
                }
            };

            pc.onicegatheringstatechange = () => {
                log('🧊 ICE gathering state [' + peerId.substring(0, 8) + ']: ' + pc.iceGatheringState);
            };

            pc.onsignalingstatechange = () => {
                log('📡 Signaling state [' + peerId.substring(0, 8) + ']: ' + pc.signalingState);
            };

            // Create offer if initiator
            if (isInitiator) {
                try {
                    log('🎬 Создаю offer для ' + peerId.substring(0, 8));
                    const offer = await pc.createOffer({
                        offerToReceiveAudio: true,
                        offerToReceiveVideo: false
                    });
                    log('✅ Offer создан, type: ' + offer.type);

                    await pc.setLocalDescription(offer);
                    log('✅ setLocalDescription выполнен');
                    log('📡 Local description: ' + pc.localDescription.type);

                    const offerData = JSON.parse(JSON.stringify(offer));
                    log('📤 Отправляю offer для ' + peerId.substring(0, 8) + ', SDP length: ' + offerData.sdp.length);

                    sendSignal(peerId, {
                        type: 'offer',
                        offer: offerData,
                        from: currentUserId
                    });
                } catch (error) {
                    log('❌ Ошибка создания offer: ' + error.name + ' - ' + error.message);
                    console.error('Offer error stack:', error.stack);
                }
            }

            updateParticipantsList();
        }

        async function handleOffer(peerId, offer) {
            log('📨 Получен offer от ' + peerId.substring(0, 8) + ', SDP length: ' + (offer.sdp ? offer.sdp.length : 'undefined'));

            if (!peerConnections[peerId]) {
                log('🔗 Peer connection отсутствует, создаю...');
                await createPeerConnection(peerId, false);
            } else {
                log('🔗 Peer connection уже существует');
            }

            const pc = peerConnections[peerId];
            log('📡 Signaling state перед setRemoteDescription: ' + pc.signalingState);

            try {
                log('🎬 Устанавливаю remote description (offer)...');
                await pc.setRemoteDescription(new RTCSessionDescription(offer));
                log('✅ Remote description установлен');

                log('🎬 Создаю answer...');
                const answer = await pc.createAnswer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: false
                });
                log('✅ Answer создан, type: ' + answer.type);

                log('🎬 Устанавливаю local description (answer)...');
                await pc.setLocalDescription(answer);
                log('✅ Local description установлен');

                const answerData = JSON.parse(JSON.stringify(answer));
                log('📤 Отправляю answer для ' + peerId.substring(0, 8) + ', SDP length: ' + answerData.sdp.length);

                sendSignal(peerId, {
                    type: 'answer',
                    answer: answerData,
                    from: currentUserId
                });
            } catch (error) {
                log('❌ Ошибка обработки offer: ' + error.name + ' - ' + error.message);
                console.error('handleOffer error stack:', error.stack);
            }
        }

        async function handleAnswer(peerId, answer) {
            log('📨 Получен answer от ' + peerId.substring(0, 8) + ', SDP length: ' + (answer.sdp ? answer.sdp.length : 'undefined'));

            const pc = peerConnections[peerId];
            if (pc) {
                log('📡 Signaling state перед setRemoteDescription: ' + pc.signalingState);
                try {
                    log('🎬 Устанавливаю remote description (answer)...');
                    await pc.setRemoteDescription(new RTCSessionDescription(answer));
                    log('✅ Answer установлен для ' + peerId.substring(0, 8));
                    log('📡 Signaling state после: ' + pc.signalingState);
                } catch (error) {
                    log('❌ Ошибка установки answer: ' + error.name + ' - ' + error.message);
                    console.error('handleAnswer error stack:', error.stack);
                }
            } else {
                log('❌ Peer connection не найден для ' + peerId.substring(0, 8));
            }
        }

        async function handleIceCandidate(peerId, candidate) {
            log('🧊 Получен ICE кандидат от ' + peerId.substring(0, 8) + ', type: ' + (candidate.type || 'unknown'));

            const pc = peerConnections[peerId];
            if (pc) {
                log('📡 Remote description установлен: ' + (pc.remoteDescription ? 'да' : 'нет'));
                log('🧊 ICE connection state: ' + pc.iceConnectionState);

                try {
                    await pc.addIceCandidate(new RTCIceCandidate(candidate));
                    log('✅ ICE кандидат добавлен для ' + peerId.substring(0, 8));
                } catch (error) {
                    log('❌ Ошибка добавления ICE: ' + error.name + ' - ' + error.message);
                    console.error('handleIceCandidate error stack:', error.stack);
                }
            } else {
                log('❌ Peer connection не найден для ' + peerId.substring(0, 8) + ', кандидат пропущен');
            }
        }

        function sendSignal(peerId, signal) {
            database.ref('signaling/' + currentRoomName + '/' + peerId).push(signal);
        }

        function updateParticipantsList() {
            const grid = document.getElementById('participantsGrid');
            grid.innerHTML = '';

            // Add self
            grid.appendChild(createParticipantCard(currentUserName, true));

            // Add peers
            database.ref('rooms/' + currentRoomName + '/participants').once('value', (snapshot) => {
                const participants = snapshot.val();
                let count = 1;

                if (participants) {
                    Object.entries(participants).forEach(([id, data]) => {
                        if (id !== currentUserId) {
                            grid.appendChild(createParticipantCard(data.name, false));
                            count++;
                        }
                    });
                }

                const text = count === 1 ? ' участник' : (count < 5 ? ' участника' : ' участников');
                document.getElementById('participantCount').textContent = count + text;
            });
        }

        function createParticipantCard(name, isSelf) {
            const card = document.createElement('div');
            card.className = 'participant-card';

            card.innerHTML = `
                <div class="participant-avatar">
                    ${isSelf ? '👤' : '👥'}
                </div>
                <div class="participant-name">${name}${isSelf ? ' (вы)' : ''}</div>
            `;

            return card;
        }

        function toggleMute() {
            if (!localStream) return;

            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                isMuted = !audioTrack.enabled;

                const muteBtn = document.getElementById('muteBtn');
                muteBtn.textContent = isMuted ? '🔇' : '🎤';
                muteBtn.classList.toggle('muted', isMuted);

                log(isMuted ? '🔇 Микрофон выключен' : '🎤 Микрофон включен');
            }
        }

        function leaveCall() {
            log('👋 Выхожу из звонка...');

            // Close all peer connections
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};

            // Remove all remote audios
            Object.values(remoteAudios).forEach(audio => audio.remove());
            remoteAudios = {};

            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Remove from room
            if (currentRoomName) {
                database.ref('rooms/' + currentRoomName + '/participants/' + currentUserId).remove();
                database.ref('signaling/' + currentRoomName + '/' + currentUserId).remove();
            }

            // Update UI
            document.getElementById('voiceChatContainer').style.display = 'none';
            document.getElementById('debugLog').innerHTML = '';

            database.ref('users/' + currentUserId).update({
                inCall: false,
                roomName: null
            });

            currentRoomName = null;
            isMuted = false;
        }

        function logout() {
            if (currentRoomName) {
                leaveCall();
            }

            database.ref('users/' + currentUserId).remove();
            sessionStorage.clear();
            location.reload();
        }

        // Keyboard shortcuts
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enterApp();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (currentRoomName) {
                leaveCall();
            }
        });
    </script>
</body>
</html>
