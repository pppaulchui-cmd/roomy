<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальные комнаты</title>
    <script src="https://meet.jit.si/external_api.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .auth-screen {
            text-align: center;
        }

        .auth-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .main-screen {
            display: none;
        }

        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-details h2 {
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.busy {
            background: #ef4444;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .team-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .team-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .member-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #666;
        }

        .join-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
        }

        .join-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .in-call-indicator {
            background: #fef3c7;
            color: #92400e;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        .admin-badge {
            background: #fbbf24;
            color: #78350f;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 30px 0 15px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        #jitsi-container {
            width: 100%;
            height: 500px;
            border-radius: 12px;
            overflow: hidden;
            margin-top: 20px;
            display: none;
        }

        .call-active {
            background: #dcfce7;
            border-color: #4ade80;
        }

        .leave-call-btn {
            background: #ef4444;
            margin-top: 15px;
        }

        .leave-call-btn:hover {
            background: #dc2626;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        /* Мобильная адаптация */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
                border-radius: 12px;
            }

            .header {
                flex-direction: column;
                text-align: center;
                gap: 10px;
            }

            h1 {
                font-size: 22px;
            }

            .subtitle {
                font-size: 13px;
            }

            .user-info {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .user-details h2 {
                font-size: 18px;
            }

            .controls {
                width: 100%;
                flex-direction: column;
            }

            .btn-secondary {
                width: 100%;
                text-align: center;
                padding: 12px;
            }

            .team-grid {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .section-title {
                font-size: 18px;
                margin: 20px 0 10px 0;
            }

            #jitsi-container {
                height: 400px;
            }

            .auth-form {
                max-width: 100%;
            }

            input {
                font-size: 16px;
            }

            button {
                padding: 12px 24px;
                font-size: 15px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 15px;
            }

            h1 {
                font-size: 20px;
            }

            .logo {
                width: 40px;
                height: 40px;
                font-size: 20px;
            }

            #jitsi-container {
                height: 300px;
            }

            .member-name {
                font-size: 16px;
            }

            .empty-state {
                padding: 30px 15px;
            }

            .empty-state-icon {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎯</div>
            <div>
                <h1>Виртуальные комнаты</h1>
                <div class="subtitle">Присоединитесь к команде</div>
            </div>
        </div>

        <!-- Password Screen -->
        <div id="passwordScreen" class="auth-screen">
            <div class="auth-form">
                <div class="form-group">
                    <label for="passwordInput">Введите пароль доступа</label>
                    <input type="password" id="passwordInput" placeholder="Пароль">
                </div>
                <button onclick="checkPassword()">Войти</button>
                <div id="passwordError" class="error-message" style="display: none; margin-top: 15px;"></div>
            </div>
        </div>

        <!-- Name Screen -->
        <div id="nameScreen" class="auth-screen" style="display: none;">
            <div class="auth-form">
                <div class="form-group">
                    <label for="nameInput">Введите ваше имя</label>
                    <input type="text" id="nameInput" placeholder="Ваше имя">
                </div>
                <button onclick="enterApp()">Войти</button>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainScreen" class="main-screen">
            <div class="user-info">
                <div class="user-details">
                    <h2 id="currentUserName">Имя пользователя</h2>
                    <div class="status-badge">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Свободен</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="btn-secondary" onclick="toggleStatus()">
                        Изменить статус
                    </div>
                    <div class="btn-secondary" onclick="logout()">
                        Выйти
                    </div>
                </div>
            </div>

            <div id="jitsi-container"></div>
            <button id="leaveCallBtn" class="join-btn leave-call-btn" style="display: none;" onclick="leaveCall()">
                Завершить звонок
            </button>

            <h3 class="section-title">Команда онлайн</h3>
            <div id="teamGrid" class="team-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">👥</div>
                    <p>Пока никого нет онлайн</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="config.js"></script>

    <script>
        firebase.initializeApp(APP_CONFIG.firebase);
        const database = firebase.database();

        let currentUserId = null;
        let currentUserName = null;
        let jitsiApi = null;
        let currentRoomName = null;

        // Восстановление сессии при загрузке
        window.addEventListener('load', () => {
            const savedUserId = sessionStorage.getItem('userId');
            const savedUserName = sessionStorage.getItem('userName');
            const isAuthenticated = sessionStorage.getItem('authenticated');

            if (isAuthenticated === 'true' && savedUserId && savedUserName) {
                currentUserId = savedUserId;
                currentUserName = savedUserName;

                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('nameScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                document.getElementById('currentUserName').textContent = currentUserName;

                initializeUser();
                listenToTeam();
            }
        });

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');

            // Проверяем пароль через Firebase
            database.ref('settings/password').once('value')
                .then((snapshot) => {
                    const correctPassword = snapshot.val();

                    if (password === correctPassword) {
                        sessionStorage.setItem('authenticated', 'true');
                        document.getElementById('passwordScreen').style.display = 'none';
                        document.getElementById('nameScreen').style.display = 'block';
                        errorDiv.style.display = 'none';
                    } else {
                        errorDiv.textContent = 'Неверный пароль';
                        errorDiv.style.display = 'block';
                    }
                })
                .catch((error) => {
                    console.error('Ошибка проверки пароля:', error);
                    errorDiv.textContent = 'Ошибка подключения';
                    errorDiv.style.display = 'block';
                });
        }

        function enterApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Пожалуйста, введите имя');
                return;
            }

            currentUserName = name;
            currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            // Сохраняем сессию
            sessionStorage.setItem('userId', currentUserId);
            sessionStorage.setItem('userName', currentUserName);

            document.getElementById('nameScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('currentUserName').textContent = currentUserName;

            initializeUser();
            listenToTeam();
        }

        function initializeUser() {
            const userRef = database.ref('users/' + currentUserId);

            userRef.set({
                name: currentUserName,
                status: 'available',
                inCall: false,
                roomName: null,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

            userRef.onDisconnect().update({
                status: 'offline',
                inCall: false,
                roomName: null
            });

            setInterval(() => {
                userRef.update({
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }, 30000);
        }

        function toggleStatus() {
            const statusText = document.getElementById('statusText').textContent;
            const newStatus = statusText === 'Свободен' ? 'busy' : 'available';

            database.ref('users/' + currentUserId).update({
                status: newStatus
            });

            updateStatusUI(newStatus);
        }

        function updateStatusUI(status) {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            if (status === 'available') {
                statusText.textContent = 'Свободен';
                statusDot.classList.remove('busy');
            } else {
                statusText.textContent = 'Занят';
                statusDot.classList.add('busy');
            }
        }

        function listenToTeam() {
            database.ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                const teamGrid = document.getElementById('teamGrid');
                teamGrid.innerHTML = '';

                if (!users) {
                    teamGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <p>Пока никого нет онлайн</p>
                        </div>
                    `;
                    return;
                }

                let hasOthers = false;
                Object.entries(users).forEach(([userId, userData]) => {
                    // Показываем всех пользователей, кроме текущего
                    if (userId !== currentUserId) {
                        hasOthers = true;
                        const card = createTeamCard(userId, userData);
                        teamGrid.appendChild(card);
                    }
                });

                if (!hasOthers) {
                    teamGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <p>Пока никого нет онлайн</p>
                        </div>
                    `;
                }
            });
        }

        function createTeamCard(userId, userData) {
            const card = document.createElement('div');
            card.className = 'team-card';
            if (userData.inCall) {
                card.classList.add('call-active');
            }

            const statusText = userData.status === 'available' ? 'Свободен' : 'Занят';
            const statusClass = userData.status === 'busy' ? 'busy' : '';

            card.innerHTML = `
                <div class="team-card-header">
                    <div>
                        <div class="member-name">${userData.name}</div>
                        <div class="member-status">
                            <span class="status-dot ${statusClass}"></span>
                            ${statusText}
                        </div>
                    </div>
                </div>
                ${userData.inCall ?
                    `<div class="in-call-indicator">📞 В звонке</div>
                     <button class="join-btn" onclick="joinRoom('${userId}', '${userData.roomName}')">
                        Присоединиться
                     </button>` :
                    `<button class="join-btn" ${userData.status === 'busy' ? 'disabled' : ''}
                        onclick="startCall('${userId}')">
                        ${userData.status === 'busy' ? '⛔ Занят' : '📞 Позвонить'}
                     </button>`
                }
            `;

            return card;
        }

        function startCall(targetUserId) {
            const roomName = 'room_' + Date.now();
            currentRoomName = roomName;

            database.ref('users/' + currentUserId).update({
                inCall: true,
                roomName: roomName
            });

            initJitsi(roomName);
        }

        function joinRoom(targetUserId, roomName) {
            currentRoomName = roomName;

            database.ref('users/' + currentUserId).update({
                inCall: true,
                roomName: roomName
            });

            initJitsi(roomName);
        }

        function initJitsi(roomName) {
            const container = document.getElementById('jitsi-container');
            container.style.display = 'block';
            document.getElementById('leaveCallBtn').style.display = 'block';

            const domain = 'meet.jit.si';
            const options = {
                roomName: roomName,
                width: '100%',
                height: '100%',
                parentNode: container,
                configOverwrite: {
                    startWithAudioMuted: false,
                    startWithVideoMuted: true,
                    prejoinPageEnabled: false,
                    disableDeepLinking: true
                },
                interfaceConfigOverwrite: {
                    TOOLBAR_BUTTONS: [
                        'microphone', 'hangup', 'settings', 'tileview'
                    ],
                    SHOW_JITSI_WATERMARK: false,
                    SHOW_WATERMARK_FOR_GUESTS: false,
                    DEFAULT_REMOTE_DISPLAY_NAME: 'Участник'
                },
                userInfo: {
                    displayName: currentUserName
                }
            };

            jitsiApi = new JitsiMeetExternalAPI(domain, options);

            jitsiApi.addListener('videoConferenceLeft', () => {
                leaveCall();
            });
        }

        function leaveCall() {
            if (jitsiApi) {
                jitsiApi.dispose();
                jitsiApi = null;
            }

            document.getElementById('jitsi-container').style.display = 'none';
            document.getElementById('leaveCallBtn').style.display = 'none';

            database.ref('users/' + currentUserId).update({
                inCall: false,
                roomName: null
            });

            currentRoomName = null;
        }

        function logout() {
            if (jitsiApi) {
                leaveCall();
            }

            database.ref('users/' + currentUserId).remove();

            // Очищаем сессию
            sessionStorage.clear();

            location.reload();
        }

        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enterApp();
        });
    </script>
</body>
</html>
