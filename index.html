<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Голосовые комнаты</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            max-width: 1000px;
            width: 100%;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .logo {
            width: 48px;
            height: 48px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
        }

        h1 {
            color: #333;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            font-size: 14px;
            margin-top: 5px;
        }

        .auth-screen {
            text-align: center;
        }

        .auth-form {
            max-width: 400px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            width: 100%;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .main-screen {
            display: none;
        }

        .user-info {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-details h2 {
            margin-bottom: 8px;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(255,255,255,0.2);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 14px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #4ade80;
        }

        .status-dot.busy {
            background: #ef4444;
        }

        .controls {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.3);
        }

        .team-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .team-card {
            background: #f9fafb;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            padding: 20px;
            transition: all 0.3s;
        }

        .team-card:hover {
            border-color: #667eea;
            transform: translateY(-4px);
            box-shadow: 0 8px 16px rgba(0,0,0,0.1);
        }

        .team-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .member-name {
            font-size: 18px;
            font-weight: 600;
            color: #333;
        }

        .member-status {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 14px;
            color: #666;
        }

        .join-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            width: 100%;
            margin-top: 10px;
        }

        .join-btn:disabled {
            background: #d1d5db;
            cursor: not-allowed;
        }

        .in-call-indicator {
            background: #fef3c7;
            color: #92400e;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }

        .section-title {
            font-size: 20px;
            font-weight: 600;
            color: #333;
            margin: 30px 0 15px 0;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .voice-chat-container {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            display: none;
            color: white;
        }

        .voice-chat-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .voice-chat-title {
            font-size: 18px;
            font-weight: 600;
        }

        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .participant-card {
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(10px);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            position: relative;
        }

        .participant-avatar {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.3);
            border-radius: 50%;
            margin: 0 auto 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            position: relative;
        }

        .speaking-indicator {
            position: absolute;
            inset: -3px;
            border: 3px solid #4ade80;
            border-radius: 50%;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .participant-name {
            font-size: 14px;
            font-weight: 500;
        }

        .audio-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .audio-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 20px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .audio-btn:hover {
            background: rgba(255,255,255,0.3);
        }

        .audio-btn.muted {
            background: #ef4444;
        }

        .leave-call-btn {
            background: #ef4444;
            width: 100%;
        }

        .leave-call-btn:hover {
            background: #dc2626;
            transform: none;
        }

        .call-active {
            background: #dcfce7;
            border-color: #4ade80;
        }

        .error-message {
            background: #fee2e2;
            color: #991b1b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 15px;
            text-align: center;
        }

        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px;
                border-radius: 12px;
            }

            .user-info {
                flex-direction: column;
                gap: 15px;
                padding: 15px;
            }

            .controls {
                width: 100%;
                flex-direction: column;
            }

            .team-grid {
                grid-template-columns: 1fr;
            }

            .participants-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">🎙️</div>
            <div>
                <h1>Голосовые комнаты</h1>
                <div class="subtitle">Групповой голосовой чат</div>
            </div>
        </div>

        <!-- Password Screen -->
        <div id="passwordScreen" class="auth-screen">
            <div class="auth-form">
                <div class="form-group">
                    <label for="passwordInput">Введите пароль доступа</label>
                    <input type="password" id="passwordInput" placeholder="Пароль">
                </div>
                <button onclick="checkPassword()">Войти</button>
                <div id="passwordError" class="error-message" style="display: none; margin-top: 15px;"></div>
            </div>
        </div>

        <!-- Name Screen -->
        <div id="nameScreen" class="auth-screen" style="display: none;">
            <div class="auth-form">
                <div class="form-group">
                    <label for="nameInput">Введите ваше имя</label>
                    <input type="text" id="nameInput" placeholder="Ваше имя">
                </div>
                <button onclick="enterApp()">Войти</button>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainScreen" class="main-screen">
            <div class="user-info">
                <div class="user-details">
                    <h2 id="currentUserName">Имя пользователя</h2>
                    <div class="status-badge">
                        <span class="status-dot" id="statusDot"></span>
                        <span id="statusText">Свободен</span>
                    </div>
                </div>
                <div class="controls">
                    <div class="btn-secondary" onclick="toggleStatus()">
                        Изменить статус
                    </div>
                    <div class="btn-secondary" onclick="logout()">
                        Выйти
                    </div>
                </div>
            </div>

            <!-- Voice Chat UI -->
            <div id="voiceChatContainer" class="voice-chat-container">
                <div class="voice-chat-header">
                    <div class="voice-chat-title">🎙️ Голосовой чат</div>
                    <div id="participantCount">2 участника</div>
                </div>

                <div id="participantsGrid" class="participants-grid"></div>

                <div class="audio-controls">
                    <button id="muteBtn" class="audio-btn" onclick="toggleMute()" title="Выкл/Вкл микрофон">
                        🎤
                    </button>
                </div>

                <button class="join-btn leave-call-btn" onclick="leaveCall()">
                    Завершить звонок
                </button>
            </div>

            <h3 class="section-title">Команда онлайн</h3>
            <div id="teamGrid" class="team-grid">
                <div class="empty-state">
                    <div class="empty-state-icon">👥</div>
                    <p>Пока никого нет онлайн</p>
                </div>
            </div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAGduZmCt1qzX_B0YDXIbLG78gzM10O8jE",
            authDomain: "roomy360-604ff.firebaseapp.com",
            databaseURL: "https://roomy360-604ff-default-rtdb.firebaseio.com",
            projectId: "roomy360-604ff",
            storageBucket: "roomy360-604ff.firebasestorage.app",
            messagingSenderId: "96561159668",
            appId: "1:96561159668:web:1e768cc2f70d7520f16da1",
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // WebRTC Configuration
        const iceServers = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        // Global State
        let currentUserId = null;
        let currentUserName = null;
        let currentRoomName = null;
        let localStream = null;
        let peerConnections = {}; // { peerId: RTCPeerConnection }
        let isMuted = false;

        // Session Management
        window.addEventListener('load', () => {
            const savedUserId = sessionStorage.getItem('userId');
            const savedUserName = sessionStorage.getItem('userName');
            const isAuthenticated = sessionStorage.getItem('authenticated');

            if (isAuthenticated === 'true' && savedUserId && savedUserName) {
                currentUserId = savedUserId;
                currentUserName = savedUserName;

                document.getElementById('passwordScreen').style.display = 'none';
                document.getElementById('nameScreen').style.display = 'none';
                document.getElementById('mainScreen').style.display = 'block';
                document.getElementById('currentUserName').textContent = currentUserName;

                initializeUser();
                listenToTeam();
            }
        });

        function checkPassword() {
            const password = document.getElementById('passwordInput').value;
            const errorDiv = document.getElementById('passwordError');

            database.ref('settings/password').once('value')
                .then((snapshot) => {
                    const correctPassword = snapshot.val();

                    if (password === correctPassword) {
                        sessionStorage.setItem('authenticated', 'true');
                        document.getElementById('passwordScreen').style.display = 'none';
                        document.getElementById('nameScreen').style.display = 'block';
                        errorDiv.style.display = 'none';
                    } else {
                        errorDiv.textContent = 'Неверный пароль';
                        errorDiv.style.display = 'block';
                    }
                })
                .catch((error) => {
                    console.error('Ошибка проверки пароля:', error);
                    errorDiv.textContent = 'Ошибка подключения';
                    errorDiv.style.display = 'block';
                });
        }

        function enterApp() {
            const name = document.getElementById('nameInput').value.trim();
            if (!name) {
                alert('Пожалуйста, введите имя');
                return;
            }

            currentUserName = name;
            currentUserId = 'user_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

            sessionStorage.setItem('userId', currentUserId);
            sessionStorage.setItem('userName', currentUserName);

            document.getElementById('nameScreen').style.display = 'none';
            document.getElementById('mainScreen').style.display = 'block';
            document.getElementById('currentUserName').textContent = currentUserName;

            initializeUser();
            listenToTeam();
        }

        function initializeUser() {
            const userRef = database.ref('users/' + currentUserId);

            userRef.set({
                name: currentUserName,
                status: 'available',
                inCall: false,
                roomName: null,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

            userRef.onDisconnect().update({
                status: 'offline',
                inCall: false,
                roomName: null
            });

            setInterval(() => {
                userRef.update({
                    lastSeen: firebase.database.ServerValue.TIMESTAMP
                });
            }, 30000);
        }

        function toggleStatus() {
            const statusText = document.getElementById('statusText').textContent;
            const newStatus = statusText === 'Свободен' ? 'busy' : 'available';

            database.ref('users/' + currentUserId).update({
                status: newStatus
            });

            updateStatusUI(newStatus);
        }

        function updateStatusUI(status) {
            const statusText = document.getElementById('statusText');
            const statusDot = document.getElementById('statusDot');

            if (status === 'available') {
                statusText.textContent = 'Свободен';
                statusDot.classList.remove('busy');
            } else {
                statusText.textContent = 'Занят';
                statusDot.classList.add('busy');
            }
        }

        function listenToTeam() {
            database.ref('users').on('value', (snapshot) => {
                const users = snapshot.val();
                const teamGrid = document.getElementById('teamGrid');
                teamGrid.innerHTML = '';

                if (!users) {
                    teamGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <p>Пока никого нет онлайн</p>
                        </div>
                    `;
                    return;
                }

                let hasOthers = false;
                Object.entries(users).forEach(([userId, userData]) => {
                    if (userId !== currentUserId) {
                        hasOthers = true;
                        const card = createTeamCard(userId, userData);
                        teamGrid.appendChild(card);
                    }
                });

                if (!hasOthers) {
                    teamGrid.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-state-icon">👥</div>
                            <p>Пока никого нет онлайн</p>
                        </div>
                    `;
                }
            });
        }

        function createTeamCard(userId, userData) {
            const card = document.createElement('div');
            card.className = 'team-card';
            if (userData.inCall) {
                card.classList.add('call-active');
            }

            const statusText = userData.status === 'available' ? 'Свободен' : 'Занят';
            const statusClass = userData.status === 'busy' ? 'busy' : '';

            card.innerHTML = `
                <div class="team-card-header">
                    <div>
                        <div class="member-name">${userData.name}</div>
                        <div class="member-status">
                            <span class="status-dot ${statusClass}"></span>
                            ${statusText}
                        </div>
                    </div>
                </div>
                ${userData.inCall ?
                    `<div class="in-call-indicator">🎙️ В голосовом чате</div>
                     <button class="join-btn" onclick="joinRoom('${userId}', '${userData.roomName}')">
                        Присоединиться
                     </button>` :
                    `<button class="join-btn" ${userData.status === 'busy' ? 'disabled' : ''}
                        onclick="startCall('${userId}')">
                        ${userData.status === 'busy' ? '⛔ Занят' : '🎙️ Позвонить'}
                     </button>`
                }
            `;

            return card;
        }

        // WebRTC Voice Chat Functions
        async function startCall(targetUserId) {
            const roomName = 'room_' + Date.now();
            currentRoomName = roomName;

            await setupLocalAudio();

            database.ref('users/' + currentUserId).update({
                inCall: true,
                roomName: roomName
            });

            document.getElementById('voiceChatContainer').style.display = 'block';
            setupSignaling(roomName);
            updateParticipantsList();
        }

        async function joinRoom(targetUserId, roomName) {
            currentRoomName = roomName;

            await setupLocalAudio();

            database.ref('users/' + currentUserId).update({
                inCall: true,
                roomName: roomName
            });

            document.getElementById('voiceChatContainer').style.display = 'block';
            setupSignaling(roomName);
            updateParticipantsList();
        }

        async function setupLocalAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    audio: {
                        echoCancellation: true,
                        noiseSuppression: true,
                        autoGainControl: true
                    },
                    video: false
                });
                console.log('✅ Микрофон подключен');
            } catch (error) {
                console.error('❌ Ошибка доступа к микрофону:', error);
                alert('Не удалось получить доступ к микрофону');
            }
        }

        function setupSignaling(roomName) {
            const roomRef = database.ref('rooms/' + roomName);

            // Announce presence
            roomRef.child('participants/' + currentUserId).set({
                name: currentUserName,
                timestamp: firebase.database.ServerValue.TIMESTAMP
            });

            roomRef.child('participants/' + currentUserId).onDisconnect().remove();

            // Listen for other participants
            roomRef.child('participants').on('child_added', (snapshot) => {
                const peerId = snapshot.key;
                if (peerId !== currentUserId && !peerConnections[peerId]) {
                    createPeerConnection(peerId, true);
                }
            });

            // Listen for participants leaving
            roomRef.child('participants').on('child_removed', (snapshot) => {
                const peerId = snapshot.key;
                if (peerConnections[peerId]) {
                    peerConnections[peerId].close();
                    delete peerConnections[peerId];
                    updateParticipantsList();
                }
            });

            // Listen for WebRTC signaling
            const signalingRef = database.ref('signaling/' + roomName + '/' + currentUserId);

            signalingRef.on('child_added', async (snapshot) => {
                const signal = snapshot.val();
                const peerId = signal.from;

                if (signal.type === 'offer') {
                    await handleOffer(peerId, signal.offer);
                } else if (signal.type === 'answer') {
                    await handleAnswer(peerId, signal.answer);
                } else if (signal.type === 'ice-candidate') {
                    await handleIceCandidate(peerId, signal.candidate);
                }

                snapshot.ref.remove();
            });
        }

        async function createPeerConnection(peerId, isInitiator) {
            const pc = new RTCPeerConnection(iceServers);
            peerConnections[peerId] = pc;

            // Add local audio stream
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Handle incoming audio
            pc.ontrack = (event) => {
                const remoteAudio = new Audio();
                remoteAudio.srcObject = event.streams[0];
                remoteAudio.play();
                console.log('🔊 Получен аудио поток от', peerId);
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignal(peerId, {
                        type: 'ice-candidate',
                        candidate: event.candidate.toJSON(),
                        from: currentUserId
                    });
                }
            };

            // Create offer if initiator
            if (isInitiator) {
                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                sendSignal(peerId, {
                    type: 'offer',
                    offer: offer.toJSON(),
                    from: currentUserId
                });
            }

            updateParticipantsList();
        }

        async function handleOffer(peerId, offer) {
            if (!peerConnections[peerId]) {
                await createPeerConnection(peerId, false);
            }

            const pc = peerConnections[peerId];
            await pc.setRemoteDescription(new RTCSessionDescription(offer));

            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            sendSignal(peerId, {
                type: 'answer',
                answer: answer.toJSON(),
                from: currentUserId
            });
        }

        async function handleAnswer(peerId, answer) {
            const pc = peerConnections[peerId];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            }
        }

        async function handleIceCandidate(peerId, candidate) {
            const pc = peerConnections[peerId];
            if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
        }

        function sendSignal(peerId, signal) {
            database.ref('signaling/' + currentRoomName + '/' + peerId).push(signal);
        }

        function updateParticipantsList() {
            const grid = document.getElementById('participantsGrid');
            grid.innerHTML = '';

            // Add self
            grid.appendChild(createParticipantCard(currentUserName, true));

            // Add peers
            database.ref('rooms/' + currentRoomName + '/participants').once('value', (snapshot) => {
                const participants = snapshot.val();
                let count = 1;

                if (participants) {
                    Object.entries(participants).forEach(([id, data]) => {
                        if (id !== currentUserId) {
                            grid.appendChild(createParticipantCard(data.name, false));
                            count++;
                        }
                    });
                }

                document.getElementById('participantCount').textContent =
                    count + (count === 1 ? ' участник' : ' участника');
            });
        }

        function createParticipantCard(name, isSelf) {
            const card = document.createElement('div');
            card.className = 'participant-card';

            card.innerHTML = `
                <div class="participant-avatar">
                    ${isSelf ? '👤' : '👥'}
                </div>
                <div class="participant-name">${name}${isSelf ? ' (вы)' : ''}</div>
            `;

            return card;
        }

        function toggleMute() {
            if (!localStream) return;

            const audioTrack = localStream.getAudioTracks()[0];
            if (audioTrack) {
                audioTrack.enabled = !audioTrack.enabled;
                isMuted = !audioTrack.enabled;

                const muteBtn = document.getElementById('muteBtn');
                muteBtn.textContent = isMuted ? '🔇' : '🎤';
                muteBtn.classList.toggle('muted', isMuted);
            }
        }

        function leaveCall() {
            // Close all peer connections
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};

            // Stop local stream
            if (localStream) {
                localStream.getTracks().forEach(track => track.stop());
                localStream = null;
            }

            // Remove from room
            if (currentRoomName) {
                database.ref('rooms/' + currentRoomName + '/participants/' + currentUserId).remove();
                database.ref('signaling/' + currentRoomName + '/' + currentUserId).remove();
            }

            // Update UI
            document.getElementById('voiceChatContainer').style.display = 'none';

            database.ref('users/' + currentUserId).update({
                inCall: false,
                roomName: null
            });

            currentRoomName = null;
            isMuted = false;
        }

        function logout() {
            if (currentRoomName) {
                leaveCall();
            }

            database.ref('users/' + currentUserId).remove();
            sessionStorage.clear();
            location.reload();
        }

        // Keyboard shortcuts
        document.getElementById('passwordInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') checkPassword();
        });

        document.getElementById('nameInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') enterApp();
        });

        // Cleanup on page unload
        window.addEventListener('beforeunload', () => {
            if (currentRoomName) {
                leaveCall();
            }
        });
    </script>
</body>
</html>
