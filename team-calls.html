<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Calls</title>
    <style>
        :root {
            --surface-0: #05070C;
            --surface-1: #0A0D12;
            --surface-2: #0F131C;
            --surface-3: #161D2B;
            --surface-4: #1E2636;
            --accent: #38BDF8;
            --accent-dim: #1E3A52;
            --text-primary: #E8EDF2;
            --text-secondary: #8B95A5;
            --success: #6EE7B7;
            --danger: #EF4444;
            --warning: #E9A568;

            --radius-pill: 999px;
            --radius-lg: 16px;
            --radius-md: 12px;
            --spacing-xs: 8px;
            --spacing-sm: 12px;
            --spacing-md: 16px;
            --spacing-lg: 24px;
            --spacing-xl: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: var(--surface-0);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: var(--spacing-xl);
        }

        /* Header */
        .header {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: var(--spacing-lg);
            padding: var(--spacing-lg);
            background: var(--surface-1);
            border-radius: var(--radius-lg);
            margin-bottom: var(--spacing-xl);
        }

        .logo {
            font-size: clamp(1.25rem, 2vw, 1.5rem);
            font-weight: 600;
            letter-spacing: -0.02em;
        }

        .current-user {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--surface-2);
            border-radius: var(--radius-pill);
        }

        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
        }

        .status-indicator.offline { background: var(--text-secondary); }
        .status-indicator.busy { background: var(--danger); }

        /* Main Layout */
        .main-grid {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: var(--spacing-xl);
        }

        /* Team List */
        .team-panel {
            background: var(--surface-1);
            border-radius: var(--radius-lg);
            padding: var(--spacing-lg);
            height: fit-content;
        }

        .panel-header {
            font-size: 0.875rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-secondary);
            margin-bottom: var(--spacing-md);
        }

        .team-member {
            display: grid;
            grid-template-columns: auto 1fr auto;
            align-items: center;
            gap: var(--spacing-sm);
            padding: var(--spacing-sm);
            background: var(--surface-2);
            border-radius: var(--radius-md);
            margin-bottom: var(--spacing-xs);
            cursor: pointer;
            transition: background 0.2s;
        }

        .team-member:hover {
            background: var(--surface-3);
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: var(--accent-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            position: relative;
        }

        .avatar-status {
            position: absolute;
            bottom: -2px;
            right: -2px;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            border: 2px solid var(--surface-2);
        }

        .member-info {
            min-width: 0;
        }

        .member-name {
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .member-status {
            font-size: 0.813rem;
            color: var(--text-secondary);
        }

        /* Buttons */
        .btn {
            padding: var(--spacing-xs) var(--spacing-md);
            border: none;
            border-radius: var(--radius-pill);
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.875rem;
        }

        .btn-primary {
            background: var(--accent);
            color: var(--surface-0);
        }

        .btn-primary:hover {
            background: #5DCCFF;
        }

        .btn-secondary {
            background: var(--surface-3);
            color: var(--text-primary);
        }

        .btn-secondary:hover {
            background: var(--surface-4);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-success {
            background: var(--success);
            color: var(--surface-0);
        }

        /* Active Call */
        .call-panel {
            background: var(--surface-1);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
        }

        .call-header {
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .call-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: var(--spacing-sm);
        }

        .call-subtitle {
            color: var(--text-secondary);
        }

        .participants-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: var(--spacing-md);
            margin-bottom: var(--spacing-xl);
        }

        .participant-card {
            background: var(--surface-2);
            border-radius: var(--radius-md);
            padding: var(--spacing-lg);
            text-align: center;
        }

        .participant-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: var(--accent-dim);
            margin: 0 auto var(--spacing-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 600;
        }

        .participant-name {
            font-weight: 500;
            margin-bottom: var(--spacing-xs);
        }

        .participant-role {
            font-size: 0.813rem;
            color: var(--text-secondary);
        }

        .call-controls {
            display: flex;
            justify-content: center;
            gap: var(--spacing-md);
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(5, 7, 12, 0.8);
            backdrop-filter: blur(4px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: var(--surface-2);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            max-width: 400px;
            width: 90%;
        }

        .modal-header {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: var(--spacing-md);
        }

        .modal-body {
            margin-bottom: var(--spacing-lg);
            color: var(--text-secondary);
        }

        .modal-actions {
            display: flex;
            gap: var(--spacing-sm);
            justify-content: flex-end;
        }

        /* Login Screen */
        .login-screen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-card {
            background: var(--surface-1);
            border-radius: var(--radius-lg);
            padding: var(--spacing-xl);
            width: 90%;
            max-width: 400px;
        }

        .login-title {
            font-size: clamp(1.5rem, 3vw, 2rem);
            font-weight: 600;
            text-align: center;
            margin-bottom: var(--spacing-xl);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-label {
            display: block;
            margin-bottom: var(--spacing-xs);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .form-input {
            width: 100%;
            padding: var(--spacing-sm) var(--spacing-md);
            background: var(--surface-2);
            border: 1px solid var(--surface-3);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 1rem;
        }

        .form-input:focus {
            outline: none;
            border-color: var(--accent);
        }

        /* Hidden */
        .hidden {
            display: none !important;
        }

        /* Console Log */
        .console-log {
            position: fixed;
            bottom: var(--spacing-md);
            right: var(--spacing-md);
            width: 350px;
            max-height: 300px;
            background: var(--surface-1);
            border-radius: var(--radius-md);
            padding: var(--spacing-sm);
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            overflow-y: auto;
            z-index: 999;
        }

        .log-entry {
            padding: 4px;
            border-bottom: 1px solid var(--surface-2);
        }

        /* Settings Modal */
        .settings-modal {
            max-width: 600px;
        }

        .settings-tabs {
            display: flex;
            gap: var(--spacing-xs);
            margin-bottom: var(--spacing-lg);
            border-bottom: 2px solid var(--surface-3);
        }

        .settings-tab {
            padding: var(--spacing-sm) var(--spacing-md);
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            margin-bottom: -2px;
        }

        .settings-tab.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
        }

        .settings-content {
            display: none;
        }

        .settings-content.active {
            display: block;
        }

        .schedule-grid {
            display: grid;
            gap: var(--spacing-md);
        }

        .schedule-row {
            display: grid;
            grid-template-columns: 120px 1fr;
            align-items: center;
            gap: var(--spacing-md);
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: var(--spacing-sm);
        }

        .checkbox {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: var(--spacing-xs);
        }

        .day-btn {
            padding: var(--spacing-xs);
            background: var(--surface-3);
            border: 2px solid transparent;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-size: 0.813rem;
            color: var(--text-primary);
        }

        .day-btn.active {
            background: var(--accent-dim);
            border-color: var(--accent);
        }

        .time-inputs {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            gap: var(--spacing-sm);
        }

        /* Admin Panel */
        .admin-user-list {
            display: grid;
            gap: var(--spacing-sm);
        }

        .admin-user-card {
            display: grid;
            grid-template-columns: auto 1fr auto auto;
            align-items: center;
            gap: var(--spacing-md);
            padding: var(--spacing-md);
            background: var(--surface-3);
            border-radius: var(--radius-md);
        }

        .admin-badge {
            padding: 4px 12px;
            background: var(--warning);
            color: var(--surface-0);
            border-radius: var(--radius-pill);
            font-size: 0.75rem;
            font-weight: 600;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.813rem;
        }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h1 class="login-title">Team Calls</h1>
            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label">Ваше имя</label>
                    <input type="text" id="nameInput" class="form-input" placeholder="Игорь" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%">Войти</button>
            </form>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="hidden">
        <div class="container">
            <!-- Header -->
            <div class="header">
                <div class="logo">Team Calls</div>
                <div></div>
                <div class="current-user">
                    <span class="status-indicator" id="myStatusIndicator"></span>
                    <span id="myName"></span>
                    <button class="btn btn-secondary btn-sm" id="settingsBtn">⚙️</button>
                </div>
            </div>

            <!-- Main Grid -->
            <div class="main-grid">
                <!-- Team List -->
                <div class="team-panel">
                    <div class="panel-header">Команда</div>
                    <div id="teamList"></div>
                </div>

                <!-- Active Call or Empty State -->
                <div class="call-panel" id="callPanel">
                    <div id="emptyState">
                        <div class="call-header">
                            <div class="call-title">Выберите участника</div>
                            <div class="call-subtitle">Нажмите "Позвонить" чтобы начать разговор</div>
                        </div>
                    </div>

                    <div id="activeCall" class="hidden">
                        <div class="call-header">
                            <div class="call-title">Активный звонок</div>
                            <div class="call-subtitle" id="callSubtitle"></div>
                        </div>
                        <div class="participants-grid" id="participantsGrid"></div>
                        <div class="call-controls">
                            <button class="btn btn-danger" id="leaveCallBtn">Завершить звонок</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Incoming Call Request Modal -->
    <div class="modal-overlay" id="incomingRequestModal">
        <div class="modal">
            <div class="modal-header">Входящий запрос</div>
            <div class="modal-body" id="requestMessage"></div>
            <div class="modal-actions">
                <button class="btn btn-secondary" id="rejectRequestBtn">Отклонить</button>
                <button class="btn btn-success" id="acceptRequestBtn">Принять</button>
            </div>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal settings-modal">
            <div class="modal-header">Настройки</div>

            <div class="settings-tabs">
                <button class="settings-tab active" data-tab="schedule">Расписание</button>
                <button class="settings-tab" data-tab="admin" id="adminTab" style="display: none">Администрирование</button>
            </div>

            <!-- Schedule Settings -->
            <div class="settings-content active" id="scheduleContent">
                <div class="schedule-grid">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="scheduleEnabled" class="checkbox">
                        <label for="scheduleEnabled">Включить автоматическое управление статусом</label>
                    </div>

                    <div class="schedule-row">
                        <label>Часовой пояс:</label>
                        <select id="timezoneSelect" class="form-input">
                            <option value="Europe/Moscow">Москва (UTC+3)</option>
                            <option value="Europe/Kiev">Киев (UTC+2)</option>
                            <option value="Europe/London">Лондон (UTC+0)</option>
                            <option value="America/New_York">Нью-Йорк (UTC-5)</option>
                            <option value="America/Los_Angeles">Лос-Анджелес (UTC-8)</option>
                            <option value="Asia/Tokyo">Токио (UTC+9)</option>
                        </select>
                    </div>

                    <div>
                        <label class="form-label">Рабочие дни:</label>
                        <div class="days-grid">
                            <button class="day-btn" data-day="1">Пн</button>
                            <button class="day-btn" data-day="2">Вт</button>
                            <button class="day-btn" data-day="3">Ср</button>
                            <button class="day-btn" data-day="4">Чт</button>
                            <button class="day-btn" data-day="5">Пт</button>
                            <button class="day-btn" data-day="6">Сб</button>
                            <button class="day-btn" data-day="0">Вс</button>
                        </div>
                    </div>

                    <div class="schedule-row">
                        <label>Рабочие часы:</label>
                        <div class="time-inputs">
                            <input type="time" id="startTimeInput" class="form-input" value="09:00">
                            <span>—</span>
                            <input type="time" id="endTimeInput" class="form-input" value="18:00">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Admin Settings -->
            <div class="settings-content" id="adminContent">
                <div class="modal-body" style="margin-bottom: var(--spacing-md)">
                    Управление пользователями команды
                </div>
                <div class="admin-user-list" id="adminUserList"></div>
            </div>

            <div class="modal-actions">
                <button class="btn btn-secondary" id="closeSettingsBtn">Закрыть</button>
                <button class="btn btn-primary" id="saveSettingsBtn">Сохранить</button>
            </div>
        </div>
    </div>

    <!-- Console Log -->
    <div class="console-log" id="consoleLog"></div>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.x/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDvbUG34TY6X7BTl_HULj26vdmG0b8oBKk",
            authDomain: "rooms-d80e4.firebaseapp.com",
            databaseURL: "https://rooms-d80e4-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "rooms-d80e4",
            storageBucket: "rooms-d80e4.firebasestorage.app",
            messagingSenderId: "1017045261267",
            appId: "1:1017045261267:web:56d6c34d6a7e099cb63e42"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        // Global State
        let currentUserId = null;
        let currentUserName = null;
        let currentCallId = null;
        let peerConnections = {};
        let localStream = null;
        let remoteAudios = {};
        let isAdmin = false;
        let scheduleCheckInterval = null;

        // Logging
        function log(message) {
            const logDiv = document.getElementById('consoleLog');
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            console.log(message);
        }

        // Login
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('nameInput').value.trim();
            const password = document.getElementById('passwordInput').value;

            if (!name) return;

            // Check project password
            const projectSnapshot = await database.ref('project').once('value');
            const projectData = projectSnapshot.val();

            if (!projectData) {
                // First user - create project with password
                await database.ref('project').set({
                    password: password,
                    createdAt: Date.now()
                });
                log('🔐 Проект создан с паролем');
            } else {
                // Verify password
                if (projectData.password !== password) {
                    alert('❌ Неверный пароль проекта!');
                    return;
                }
            }

            currentUserId = 'user_' + Date.now();
            currentUserName = name;

            // Check if this is the first user (admin)
            const usersSnapshot = await database.ref('users').once('value');
            const isFirstUser = !usersSnapshot.exists() || Object.keys(usersSnapshot.val() || {}).length === 0;

            // Register user
            await database.ref('users/' + currentUserId).set({
                name: name,
                status: 'online',
                isAdmin: isFirstUser,
                currentCall: null,
                lastSeen: Date.now(),
                schedule: {
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    workDays: [1, 2, 3, 4, 5],
                    startTime: '09:00',
                    endTime: '18:00',
                    enabled: false
                }
            });

            // Setup presence
            database.ref('users/' + currentUserId + '/status').onDisconnect().set('offline');
            database.ref('users/' + currentUserId + '/lastSeen').onDisconnect().set(firebase.database.ServerValue.TIMESTAMP);

            // Initialize audio
            await initializeAudio();

            // Show main app
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            document.getElementById('myName').textContent = name;

            log('✅ Вошли как ' + name + (isFirstUser ? ' (Админ)' : ''));

            // Start listening
            listenToTeam();
            listenToCallRequests();
        });

        // Initialize Audio
        async function initializeAudio() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                log('🎤 Микрофон подключен');
            } catch (error) {
                log('❌ Ошибка доступа к микрофону: ' + error.message);
            }
        }

        // Listen to Team
        function listenToTeam() {
            const teamList = document.getElementById('teamList');

            database.ref('users').on('value', (snapshot) => {
                teamList.innerHTML = '';
                const users = snapshot.val() || {};

                Object.entries(users).forEach(([userId, userData]) => {
                    if (userId === currentUserId) return;

                    const memberDiv = document.createElement('div');
                    memberDiv.className = 'team-member';

                    const statusClass = userData.status === 'online' ? 'success' :
                                      userData.status === 'busy' ? 'danger' : 'text-secondary';

                    const statusText = userData.currentCall ?
                        `В разговоре` :
                        userData.status === 'online' ? 'Свободен' : 'Не в сети';

                    memberDiv.innerHTML = `
                        <div class="avatar">
                            ${userData.name.charAt(0).toUpperCase()}
                            <div class="avatar-status" style="background: var(--${statusClass})"></div>
                        </div>
                        <div class="member-info">
                            <div class="member-name">${userData.name}</div>
                            <div class="member-status">${statusText}</div>
                        </div>
                        <button class="btn btn-primary btn-sm call-btn"
                                data-user-id="${userId}"
                                data-user-name="${userData.name}"
                                data-call-id="${userData.currentCall || ''}"
                                ${userData.status !== 'online' ? 'disabled' : ''}>
                            ${userData.currentCall ? '🔔 Запрос' : '📞 Позвонить'}
                        </button>
                    `;

                    teamList.appendChild(memberDiv);
                });

                // Add click handlers
                document.querySelectorAll('.call-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const userId = e.target.dataset.userId;
                        const userName = e.target.dataset.userName;
                        const callId = e.target.dataset.callId;
                        initiateCall(userId, userName, callId);
                    });
                });
            });
        }

        // Initiate Call
        async function initiateCall(targetUserId, targetUserName, existingCallId) {
            if (existingCallId) {
                // Join existing call
                log('🔔 Отправка запроса на подключение к звонку...');
            } else {
                // New call
                log('📞 Звоню ' + targetUserName + '...');
            }

            const requestId = 'request_' + Date.now();
            await database.ref('callRequests/' + requestId).set({
                from: currentUserId,
                to: targetUserId,
                callId: existingCallId || null,
                status: 'pending',
                timestamp: Date.now()
            });
        }

        // Listen to Call Requests
        function listenToCallRequests() {
            database.ref('callRequests').on('child_added', async (snapshot) => {
                const request = snapshot.val();
                const requestId = snapshot.key;

                // Incoming request
                if (request.to === currentUserId && request.status === 'pending') {
                    const fromUser = await database.ref('users/' + request.from).once('value');
                    const fromUserData = fromUser.val();

                    document.getElementById('requestMessage').textContent =
                        `${fromUserData.name} хочет ${request.callId ? 'присоединиться к вашему разговору' : 'позвонить вам'}`;

                    document.getElementById('incomingRequestModal').classList.add('active');

                    // Accept
                    document.getElementById('acceptRequestBtn').onclick = async () => {
                        await acceptCallRequest(requestId, request);
                        document.getElementById('incomingRequestModal').classList.remove('active');
                    };

                    // Reject
                    document.getElementById('rejectRequestBtn').onclick = async () => {
                        await database.ref('callRequests/' + requestId).update({ status: 'rejected' });
                        document.getElementById('incomingRequestModal').classList.remove('active');
                        log('❌ Запрос отклонен');
                    };
                }

                // Outgoing request response
                if (request.from === currentUserId && request.status === 'accepted') {
                    log('✅ Запрос принят, подключение...');
                    await joinCall(request.callId);
                    await database.ref('callRequests/' + requestId).remove();
                }

                if (request.from === currentUserId && request.status === 'rejected') {
                    log('❌ Запрос отклонен');
                    await database.ref('callRequests/' + requestId).remove();
                }
            });
        }

        // Accept Call Request
        async function acceptCallRequest(requestId, request) {
            let callId = request.callId;

            // Create new call if doesn't exist
            if (!callId) {
                callId = 'call_' + Date.now();
                await database.ref('calls/' + callId).set({
                    host: currentUserId,
                    participants: {
                        [currentUserId]: { joined: Date.now() }
                    },
                    createdAt: Date.now(),
                    status: 'active'
                });

                currentCallId = callId;
                await database.ref('users/' + currentUserId).update({ currentCall: callId });
            }

            // Add participant
            await database.ref('calls/' + callId + '/participants/' + request.from).set({ joined: Date.now() });
            await database.ref('users/' + request.from).update({ currentCall: callId });
            await database.ref('callRequests/' + requestId).update({ status: 'accepted', callId: callId });

            log('✅ Звонок начат: ' + callId);

            // Start own call if not in one
            if (!currentCallId) {
                await joinCall(callId);
            }
        }

        // Join Call
        async function joinCall(callId) {
            currentCallId = callId;
            await database.ref('users/' + currentUserId).update({ currentCall: callId });

            // Show call UI
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('activeCall').classList.remove('hidden');

            // Listen to participants
            database.ref('calls/' + callId + '/participants').on('value', async (snapshot) => {
                const participants = snapshot.val() || {};
                await updateParticipantsUI(participants);
            });

            log('📞 Подключились к звонку: ' + callId);
        }

        // Update Participants UI
        async function updateParticipantsUI(participants) {
            const grid = document.getElementById('participantsGrid');
            grid.innerHTML = '';

            for (const [userId, data] of Object.entries(participants)) {
                const userSnapshot = await database.ref('users/' + userId).once('value');
                const userData = userSnapshot.val();

                const card = document.createElement('div');
                card.className = 'participant-card';
                card.innerHTML = `
                    <div class="participant-avatar">${userData.name.charAt(0).toUpperCase()}</div>
                    <div class="participant-name">${userData.name}</div>
                    <div class="participant-role">${userId === currentUserId ? '(Вы)' : ''}</div>
                `;
                grid.appendChild(card);

                // Setup WebRTC if needed
                if (userId !== currentUserId && !peerConnections[userId]) {
                    const isInitiator = currentUserId > userId;
                    await createPeerConnection(userId, isInitiator);
                }
            }
        }

        // Leave Call
        document.getElementById('leaveCallBtn').addEventListener('click', async () => {
            if (!currentCallId) return;

            // Remove from call
            await database.ref('calls/' + currentCallId + '/participants/' + currentUserId).remove();
            await database.ref('users/' + currentUserId).update({ currentCall: null });

            // Close peer connections
            Object.values(peerConnections).forEach(pc => pc.close());
            peerConnections = {};

            // Hide call UI
            document.getElementById('activeCall').classList.add('hidden');
            document.getElementById('emptyState').classList.remove('hidden');

            currentCallId = null;
            log('📴 Вышли из звонка');
        });

        // WebRTC Functions (копируем из index.html)
        async function createPeerConnection(peerId, isInitiator) {
            log('🔗 Создание соединения с ' + peerId.substring(0, 8) + ' (initiator: ' + isInitiator + ')');

            const configuration = {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' }
                ]
            };

            const pc = new RTCPeerConnection(configuration);
            peerConnections[peerId] = pc;

            // Add local stream
            if (localStream) {
                localStream.getTracks().forEach(track => {
                    pc.addTrack(track, localStream);
                });
            }

            // Handle remote stream
            pc.ontrack = (event) => {
                log('📥 Получен удаленный поток от ' + peerId.substring(0, 8));
                const audio = document.createElement('audio');
                audio.srcObject = event.streams[0];
                audio.autoplay = true;
                remoteAudios[peerId] = audio;
            };

            // Handle ICE candidates
            pc.onicecandidate = (event) => {
                if (event.candidate) {
                    sendSignal(peerId, {
                        from: currentUserId,
                        type: 'ice-candidate',
                        candidate: event.candidate
                    });
                }
            };

            // Connection state
            pc.onconnectionstatechange = () => {
                log('🔄 Состояние соединения: ' + pc.connectionState);
            };

            // Create offer if initiator
            if (isInitiator) {
                try {
                    const offer = await pc.createOffer();
                    await pc.setLocalDescription(offer);
                    sendSignal(peerId, {
                        from: currentUserId,
                        type: 'offer',
                        offer: offer
                    });
                    log('📤 Отправлен offer для ' + peerId.substring(0, 8));
                } catch (error) {
                    log('❌ Ошибка создания offer: ' + error.message);
                }
            }

            // Listen for signals
            setupSignalingListener(peerId);
        }

        function setupSignalingListener(peerId) {
            const signalingRef = database.ref('signaling/' + currentCallId + '/' + currentUserId);

            signalingRef.on('child_added', async (snapshot) => {
                const signal = snapshot.val();
                const fromPeerId = signal.from;

                if (fromPeerId === currentUserId) {
                    snapshot.ref.remove();
                    return;
                }

                log('📡 Получен сигнал: ' + signal.type + ' от ' + fromPeerId.substring(0, 8));

                try {
                    if (signal.type === 'offer') {
                        await handleOffer(fromPeerId, signal.offer);
                    } else if (signal.type === 'answer') {
                        await handleAnswer(fromPeerId, signal.answer);
                    } else if (signal.type === 'ice-candidate') {
                        await handleIceCandidate(fromPeerId, signal.candidate);
                    }
                } catch (error) {
                    log('❌ Ошибка обработки сигнала: ' + error.message);
                }

                snapshot.ref.remove();
            });
        }

        async function handleOffer(peerId, offer) {
            let pc = peerConnections[peerId];
            if (!pc) {
                pc = await createPeerConnection(peerId, false);
            }

            await pc.setRemoteDescription(new RTCSessionDescription(offer));
            const answer = await pc.createAnswer();
            await pc.setLocalDescription(answer);

            sendSignal(peerId, {
                from: currentUserId,
                type: 'answer',
                answer: answer
            });
        }

        async function handleAnswer(peerId, answer) {
            const pc = peerConnections[peerId];
            if (pc) {
                await pc.setRemoteDescription(new RTCSessionDescription(answer));
            }
        }

        async function handleIceCandidate(peerId, candidate) {
            const pc = peerConnections[peerId];
            if (pc) {
                await pc.addIceCandidate(new RTCIceCandidate(candidate));
            }
        }

        function sendSignal(peerId, signal) {
            database.ref('signaling/' + currentCallId + '/' + peerId).push(signal);
        }

        // Settings Modal
        document.getElementById('settingsBtn').addEventListener('click', async () => {
            // Load current user settings
            const userSnapshot = await database.ref('users/' + currentUserId).once('value');
            const userData = userSnapshot.val();

            isAdmin = userData.isAdmin || false;

            // Show admin tab if admin
            if (isAdmin) {
                document.getElementById('adminTab').style.display = 'block';
            }

            // Load schedule settings
            const schedule = userData.schedule || {};
            document.getElementById('scheduleEnabled').checked = schedule.enabled || false;
            document.getElementById('timezoneSelect').value = schedule.timezone || Intl.DateTimeFormat().resolvedOptions().timeZone;
            document.getElementById('startTimeInput').value = schedule.startTime || '09:00';
            document.getElementById('endTimeInput').value = schedule.endTime || '18:00';

            // Load work days
            const workDays = schedule.workDays || [1, 2, 3, 4, 5];
            document.querySelectorAll('.day-btn').forEach(btn => {
                const day = parseInt(btn.dataset.day);
                btn.classList.toggle('active', workDays.includes(day));
            });

            // Load admin user list if admin
            if (isAdmin) {
                await loadAdminUserList();
            }

            document.getElementById('settingsModal').classList.add('active');
        });

        // Settings tabs
        document.querySelectorAll('.settings-tab').forEach(tab => {
            tab.addEventListener('click', () => {
                const targetTab = tab.dataset.tab;

                document.querySelectorAll('.settings-tab').forEach(t => t.classList.remove('active'));
                document.querySelectorAll('.settings-content').forEach(c => c.classList.remove('active'));

                tab.classList.add('active');
                document.getElementById(targetTab + 'Content').classList.add('active');
            });
        });

        // Work days selection
        document.querySelectorAll('.day-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                btn.classList.toggle('active');
            });
        });

        // Save settings
        document.getElementById('saveSettingsBtn').addEventListener('click', async () => {
            const scheduleEnabled = document.getElementById('scheduleEnabled').checked;
            const timezone = document.getElementById('timezoneSelect').value;
            const startTime = document.getElementById('startTimeInput').value;
            const endTime = document.getElementById('endTimeInput').value;

            const workDays = Array.from(document.querySelectorAll('.day-btn.active'))
                .map(btn => parseInt(btn.dataset.day));

            await database.ref('users/' + currentUserId + '/schedule').update({
                enabled: scheduleEnabled,
                timezone: timezone,
                workDays: workDays,
                startTime: startTime,
                endTime: endTime
            });

            log('✅ Настройки сохранены');

            // Start/stop schedule checking
            if (scheduleEnabled) {
                startScheduleChecking();
            } else {
                stopScheduleChecking();
            }

            document.getElementById('settingsModal').classList.remove('active');
        });

        document.getElementById('closeSettingsBtn').addEventListener('click', () => {
            document.getElementById('settingsModal').classList.remove('active');
        });

        // Schedule checking
        function startScheduleChecking() {
            if (scheduleCheckInterval) return;

            scheduleCheckInterval = setInterval(async () => {
                const userSnapshot = await database.ref('users/' + currentUserId).once('value');
                const userData = userSnapshot.val();
                const schedule = userData.schedule;

                if (!schedule || !schedule.enabled) return;

                const now = new Date();
                const currentDay = now.getDay();
                const currentTime = now.toLocaleTimeString('ru-RU', {
                    hour: '2-digit',
                    minute: '2-digit',
                    timeZone: schedule.timezone
                });

                const isWorkDay = schedule.workDays.includes(currentDay);
                const isWorkTime = currentTime >= schedule.startTime && currentTime < schedule.endTime;

                const shouldBeAvailable = isWorkDay && isWorkTime;
                const currentStatus = userData.status;

                // Auto-update status based on schedule
                if (shouldBeAvailable && currentStatus === 'dnd') {
                    await setStatus('available');
                    log('📅 Статус изменен на "Доступен" по расписанию');
                } else if (!shouldBeAvailable && currentStatus === 'available') {
                    await setStatus('dnd');
                    log('📅 Статус изменен на "Не беспокоить" по расписанию');
                }
            }, 60000); // Check every minute
        }

        function stopScheduleChecking() {
            if (scheduleCheckInterval) {
                clearInterval(scheduleCheckInterval);
                scheduleCheckInterval = null;
            }
        }

        // Admin functions
        async function loadAdminUserList() {
            const usersSnapshot = await database.ref('users').once('value');
            const users = usersSnapshot.val() || {};

            const userList = document.getElementById('adminUserList');
            userList.innerHTML = '';

            Object.entries(users).forEach(([userId, userData]) => {
                const card = document.createElement('div');
                card.className = 'admin-user-card';

                const avatar = document.createElement('div');
                avatar.className = 'member-avatar';
                avatar.textContent = userData.name.charAt(0).toUpperCase();
                avatar.style.background = getColorForName(userData.name);

                const info = document.createElement('div');
                info.style.display = 'flex';
                info.style.flexDirection = 'column';
                info.style.gap = '4px';

                const name = document.createElement('div');
                name.style.fontWeight = '500';
                name.textContent = userData.name;

                const status = document.createElement('div');
                status.style.fontSize = '0.813rem';
                status.style.color = 'var(--text-secondary)';
                status.textContent = userId === currentUserId ? 'Вы' : `Статус: ${getStatusText(userData.status)}`;

                info.appendChild(name);
                info.appendChild(status);

                if (userData.isAdmin) {
                    const badge = document.createElement('div');
                    badge.className = 'admin-badge';
                    badge.textContent = 'АДМИН';
                    card.appendChild(badge);
                }

                card.appendChild(avatar);
                card.appendChild(info);

                // Admin actions
                if (userId !== currentUserId) {
                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'btn btn-danger btn-sm';
                    removeBtn.textContent = 'Удалить';
                    removeBtn.addEventListener('click', async () => {
                        if (confirm(`Удалить пользователя ${userData.name}?`)) {
                            await database.ref('users/' + userId).remove();
                            log(`🗑️ Пользователь ${userData.name} удален`);
                            await loadAdminUserList();
                        }
                    });
                    card.appendChild(removeBtn);

                    if (!userData.isAdmin) {
                        const makeAdminBtn = document.createElement('button');
                        makeAdminBtn.className = 'btn btn-secondary btn-sm';
                        makeAdminBtn.textContent = 'Сделать админом';
                        makeAdminBtn.addEventListener('click', async () => {
                            await database.ref('users/' + userId + '/isAdmin').set(true);
                            log(`👑 ${userData.name} теперь администратор`);
                            await loadAdminUserList();
                        });
                        card.appendChild(makeAdminBtn);
                    }
                }

                userList.appendChild(card);
            });
        }

        function getStatusText(status) {
            const statusMap = {
                'online': 'В сети',
                'available': 'Доступен',
                'busy': 'Занят',
                'dnd': 'Не беспокоить',
                'offline': 'Не в сети'
            };
            return statusMap[status] || status;
        }

        // Initialize schedule checking on login
        database.ref('users/' + currentUserId + '/schedule/enabled').on('value', (snapshot) => {
            if (snapshot.val()) {
                startScheduleChecking();
            } else {
                stopScheduleChecking();
            }
        });
    </script>
</body>
</html>
